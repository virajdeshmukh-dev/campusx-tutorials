[project]
name = "campusx-tutorials"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kzr", email = "virajdeshmukh.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-generativeai>=0.8.6",
    "huggingface-hub>=1.33.0",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.0",
    "numpy>=2.5.3",
    "openai>=3.26.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "transformers>=5.19.0",
]

[project.scripts]
campusx-tutorials = "campusx_tutorials:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
